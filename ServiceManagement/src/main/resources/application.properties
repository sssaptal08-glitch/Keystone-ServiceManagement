spring.application.name=ServiceManagement

# --- Railway Server Port ---
server.port=${PORT:8080}

# --- MySQL / Aiven ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# Flyway manages the database schema.
# Hibernate only validates the schema against the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Jackson ---
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# --- CORS ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000}

# --- JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- SLA thresholds (hours) ---
app.sla.critical-hours=4
app.sla.high-hours=8
app.sla.medium-hours=24
app.sla.low-hours=72
app.sla.at-risk-hours=2
app.sla.check-interval-ms=300000

# --- File uploads ---
app.upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# --- Springdoc / Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- Actuator ---
management.endpoints.web.exposure.include=health,info

# --- Logging ---
logging.level.com.KEYSTONE.ServiceManagement=INFO
