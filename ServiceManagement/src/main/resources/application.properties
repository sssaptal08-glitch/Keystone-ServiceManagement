spring.application.name=ServiceManagement

server.port=${SERVER_PORT:8080}

# --- MySQL 8+ ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/keystone?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Sujal@2004}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# Flyway owns the schema; Hibernate only validates it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Jackson ---
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# --- CORS (frontend dev server) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000}

# --- JWT ---
app.jwt.secret=${JWT_SECRET:2f9d8c7b6a5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9c}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- SLA thresholds (hours), used for reference by dispatch policy ---
app.sla.critical-hours=4
app.sla.high-hours=8
app.sla.medium-hours=24
app.sla.low-hours=72
app.sla.at-risk-hours=2
app.sla.check-interval-ms=300000

# --- File uploads (work order attachments) ---
app.upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# --- springdoc / swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- actuator ---
management.endpoints.web.exposure.include=health,info

logging.level.com.KEYSTONE.ServiceManagement=INFO
