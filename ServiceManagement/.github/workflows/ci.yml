name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (JDK 21, Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Runs both plain unit tests and the Testcontainers-backed integration test in one pass.
      # GitHub-hosted runners come with a Docker daemon pre-installed, which Testcontainers
      # uses automatically to spin up a real MySQL 8 container for WorkOrderIntegrationTest.
      - name: Run tests (unit + Testcontainers integration)
        run: ./mvnw -B test

      - name: Build jar
        run: ./mvnw -B -q clean package -DskipTests

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: service-management-jar
          path: target/*.jar

  frontend:
    name: Frontend (Node 22, Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
