version: "3.9"

services:
  mysql:
    image: mysql:8.0.36
    container_name: keystone-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: keystone
      MYSQL_USER: keystone_user
      MYSQL_PASSWORD: keystone_pass
      MYSQL_ROOT_PASSWORD: root_pass_change_me
    ports:
      - "3306:3306"
    volumes:
      - keystone_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass_change_me"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keystone-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/keystone?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: keystone_user
      DB_PASSWORD: keystone_pass
      JWT_SECRET: ${JWT_SECRET:-2f9d8c7b6a5e4d3c2b1a0f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9c}
      CORS_ALLOWED_ORIGINS: http://localhost:8081
      UPLOAD_DIR: /app/uploads
    ports:
      - "8080:8080"
    volumes:
      - keystone_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: keystone-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  keystone_mysql_data:
  keystone_uploads:
